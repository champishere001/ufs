<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ETH live price</title>
<style>
  :root {
    --bg: #f5f6fb; --panel: #ffffff; --ink: #151a33; --muted: #6b7194;
    --line: #dfe2f0; --up: #0f9d6b; --down: #d6455d; --accent: #4b5fd6;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1020; --panel: #151934; --ink: #e8eaf8; --muted: #8a90b8;
      --line: #262b50; --up: #3ddc97; --down: #ff6b7f; --accent: #8c9eff;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px 48px;
  }
  main { max-width: 960px; margin: 0 auto; display: grid; gap: 16px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 1.05rem; font-weight: 600; margin: 0; }
  .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .9rem; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--up); }
  .dot.wait { background: #e0a526; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .price {
    font-size: clamp(2.8rem, 10vw, 5.5rem); font-weight: 700; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums; line-height: 1.05; margin: 0; transition: color .25s;
  }
  .price.up { color: var(--up); }
  .price.down { color: var(--down); }
  .pair { color: var(--muted); margin: 0 0 4px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 16px; margin-top: 20px; }
  .stats dt { color: var(--muted); font-size: .85rem; }
  .stats dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
  canvas { width: 100%; height: 220px; display: block; }
  .cols { display: grid; grid-template-columns: 1fr; gap: 16px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: .92rem; }
  th { text-align: left; color: var(--muted); font-weight: 500; padding: 0 0 8px; }
  td { padding: 4px 0; }
  td:nth-child(2), th:nth-child(2), td:nth-child(3), th:nth-child(3) { text-align: right; }
  .buy { color: var(--up); } .sell { color: var(--down); }
  .note { color: var(--muted); font-size: .85rem; margin: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Ethereum live trades</h1>
    <div class="status" role="status" aria-live="polite"><span class="dot wait" id="dot"></span><span id="statusText">Connecting…</span></div>
  </header>

  <section class="panel">
    <p class="pair" id="pair">ETH / USDT</p>
    <p class="price" id="price" aria-live="off">–</p>
    <dl class="stats">
      <div><dt>24h change</dt><dd id="chg">–</dd></div>
      <div><dt>24h high</dt><dd id="hi">–</dd></div>
      <div><dt>24h low</dt><dd id="lo">–</dd></div>
      <div><dt>24h volume (ETH)</dt><dd id="vol">–</dd></div>
    </dl>
  </section>

  <section class="panel"><canvas id="chart" aria-label="Price of the last trades"></canvas></section>

  <section class="panel">
    <table>
      <thead><tr><th>Time</th><th>Price</th><th>Size (ETH)</th></tr></thead>
      <tbody id="tape"></tbody>
    </table>
  </section>

  <p class="note" id="source">Source: Binance public trade stream.</p>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const MAX_POINTS = 300, MAX_ROWS = 14;
  const fmt = (n, d = 2) => Number(n).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });

  const feeds = [
    { name: "Binance", pair: "ETH / USDT", url: "wss://stream.binance.com:9443/ws/ethusdt@trade",
      parse(m) { return m.e === "trade" ? { price: +m.p, qty: +m.q, time: m.T, buy: !m.m } : null; } },
    { name: "Coinbase", pair: "ETH / USD", url: "wss://ws-feed.exchange.coinbase.com",
      sub: { type: "subscribe", product_ids: ["ETH-USD"], channels: ["matches"] },
      parse(m) { return m.type === "match" || m.type === "last_match"
        ? { price: +m.price, qty: +m.size, time: Date.parse(m.time), buy: m.side === "sell" } : null; } }
  ];

  let feedIdx = 0, ws, failures = 0, last = null;
  const points = [];
  const rows = [];

  function setStatus(state, text) {
    $("dot").className = "dot " + state;
    $("statusText").textContent = text;
  }

  function connect() {
    const feed = feeds[feedIdx];
    $("pair").textContent = feed.pair;
    $("source").textContent = `Source: ${feed.name} public trade stream.`;
    setStatus("wait", `Connecting to ${feed.name}…`);
    ws = new WebSocket(feed.url);
    let opened = false;
    ws.onopen = () => {
      opened = true; failures = 0;
      if (feed.sub) ws.send(JSON.stringify(feed.sub));
      setStatus("live", `Live · ${feed.name}`);
    };
    ws.onmessage = ev => {
      try { const t = feed.parse(JSON.parse(ev.data)); if (t) onTrade(t); } catch (e) { /* ignore bad frame */ }
    };
    ws.onclose = () => {
      failures = opened ? 0 : failures + 1;
      if (failures >= 3) { feedIdx = (feedIdx + 1) % feeds.length; failures = 0; }
      setStatus("wait", "Reconnecting…");
      setTimeout(connect, Math.min(1000 * 2 ** failures, 8000));
    };
    ws.onerror = () => ws.close();
  }

  function onTrade(t) {
    const el = $("price");
    el.textContent = fmt(t.price);
    if (last !== null && t.price !== last) el.className = "price " + (t.price > last ? "up" : "down");
    last = t.price;
    points.push(t.price);
    if (points.length > MAX_POINTS) points.shift();
    rows.unshift(t);
    if (rows.length > MAX_ROWS) rows.pop();
    schedule();
  }

  let queued = false;
  function schedule() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; drawTape(); drawChart(); });
  }

  function drawTape() {
    $("tape").innerHTML = rows.map(r =>
      `<tr><td>${new Date(r.time).toLocaleTimeString()}</td>` +
      `<td class="${r.buy ? "buy" : "sell"}">${fmt(r.price)}</td><td>${fmt(r.qty, 4)}</td></tr>`).join("");
  }

  function drawChart() {
    const c = $("chart"), dpr = window.devicePixelRatio || 1;
    const w = c.clientWidth, h = c.clientHeight;
    if (c.width !== w * dpr || c.height !== h * dpr) { c.width = w * dpr; c.height = h * dpr; }
    const g = c.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    if (points.length < 2) return;
    const css = getComputedStyle(document.documentElement);
    const min = Math.min(...points), max = Math.max(...points), pad = (max - min || 1) * .15;
    const lo = min - pad, hi = max + pad;
    const x = i => (i / (MAX_POINTS - 1)) * (w - 56) + 0;
    const y = p => h - ((p - lo) / (hi - lo)) * h;
    const offset = MAX_POINTS - points.length;
    g.strokeStyle = css.getPropertyValue("--line"); g.lineWidth = 1; g.fillStyle = css.getPropertyValue("--muted");
    g.font = "12px system-ui, sans-serif";
    for (let k = 0; k <= 3; k++) {
      const p = lo + ((hi - lo) * k) / 3, yy = y(p);
      g.beginPath(); g.moveTo(0, yy); g.lineTo(w - 56, yy); g.stroke();
      g.fillText(fmt(p), w - 52, yy + 4);
    }
    g.strokeStyle = css.getPropertyValue("--accent"); g.lineWidth = 2; g.lineJoin = "round";
    g.beginPath();
    points.forEach((p, i) => (i ? g.lineTo(x(i + offset), y(p)) : g.moveTo(x(i + offset), y(p))));
    g.stroke();
  }

  async function loadStats() {
    try {
      const r = await fetch("https://api.binance.com/api/v3/ticker/24hr?symbol=ETHUSDT");
      const d = await r.json();
      const pct = +d.priceChangePercent;
      $("chg").textContent = (pct >= 0 ? "+" : "") + fmt(pct) + "%";
      $("chg").style.color = pct >= 0 ? "var(--up)" : "var(--down)";
      $("hi").textContent = fmt(d.highPrice);
      $("lo").textContent = fmt(d.lowPrice);
      $("vol").textContent = fmt(d.volume, 0);
    } catch (e) { /* stats stay as dashes if the REST call is blocked */ }
  }

  window.addEventListener("resize", schedule);
  loadStats(); setInterval(loadStats, 30000);
  connect();
})();
</script>
</body>
</html>
